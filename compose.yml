# Ambiente local com Docker ou Podman Compose: o mesmo app que roda no NKP.
#   docker compose up --build      (ou: podman compose up --build)
#   http://localhost:8080
# Credenciais apenas de demo.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: divelog
      MYSQL_USER: divelog
      MYSQL_PASSWORD: divelog
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://divelog:divelog@mysql:3306/divelog
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mysql-data:
