# Configuração usada no Docker/Podman Compose. No Kubernetes, o Helm chart
# substitui este arquivo por um ConfigMap que aponta para o Service do backend.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Serve a SPA: qualquer caminho desconhecido volta para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: /api/* -> backend:8000/*
    # A barra no fim do proxy_pass remove o prefixo /api/.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
